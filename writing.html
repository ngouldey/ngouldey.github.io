<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ng / writing</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .essay-container {
            margin: 2rem 0;
            border-left: 3px solid var(--neon-pink);
            padding-left: 2rem;
        }

        .essay-item {
            background: rgba(255, 255, 255, 0.03);
            margin: 1.5rem 0;
            padding: 1rem;
            border: 1px solid var(--electric-blue);
            transition: all 0.3s;
        }

        .essay-header {
            cursor: pointer;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .essay-header:hover {
            background: rgba(0, 255, 255, 0.05);
        }

        .essay-title {
            color: var(--neon-pink);
            margin: 0;
            font-size: 1.4rem;
        }

        .essay-date {
            color: var(--electric-blue);
            font-size: 0.9rem;
        }

        .essay-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
            padding: 0 1rem;
            color: #ccc;
        }

        .expand-icon {
            color: var(--vapor-yellow);
            font-size: 1.5rem;
            margin-left: 1rem;
        }

        .essay-item.expanded {
            border-color: var(--vapor-yellow);
            box-shadow: 0 0 15px rgba(255, 240, 58, 0.2);
        }
    </style>
</head>
<body>
    <div class="scanline"></div>

    <aside class="sidebar neon-pulse">
        <img src="profile-image.jpg" alt="Profile" class="profile-img">
        <nav>
            <a href="index.html">about</a>
            <a href="resume.html">resume</a>
            <a href="music.html">music</a>
            <a href="#writing">writing</a>
        </nav>
    </aside>

    <main>
        <section id="writing">
            <h1>writing</h1>
            <p class="neon-blue">essays</p>

            <div class="essay-container">
                <!-- Essay 1 -->
                <div class="essay-item">
                    <div class="essay-header" onclick="toggleEssay(this)">
                        <div>
                            <h2 class="essay-title">working example</h2>
                            <p class="essay-date">march 2023</p>
                        </div>
                        <span class="expand-icon">+</span>
                    </div>
                    <div class="essay-content">
                        <p>working example</p>
                    </div>
                </div>

                <!-- Essay 2 -->
                <div class="essay-item">
                    <div class="essay-header" onclick="toggleEssay(this)">
                        <div>
                            <h2 class="essay-title">working example</h2>
                            <p class="essay-date">january 2024</p>
                        </div>
                        <span class="expand-icon">+</span>
                    </div>
                    <div class="essay-content">
                        <p>working example</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script>
        function toggleEssay(header) {
            const essayItem = header.parentElement;
            const content = essayItem.querySelector('.essay-content');
            const icon = essayItem.querySelector('.expand-icon');

            essayItem.classList.toggle('expanded');

            if (content.style.maxHeight) {
                content.style.maxHeight = null;
                icon.textContent = '+';
                content.setAttribute('aria-expanded', 'false');
            } else {
                content.style.maxHeight = content.scrollHeight + "px";
                icon.textContent = '-';
                content.setAttribute('aria-expanded', 'true');
            }
        }
    </script>
</body>
</html>
