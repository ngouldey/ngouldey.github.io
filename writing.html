<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ng / writing</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <style>
        .writing-filters {
            margin: 2rem 0;
            display: flex;
            gap: 1rem;
            padding: 1rem 0;
            border-bottom: 2px solid var(--neon-pink);
        }

        .filter-btn {
            padding: 0.8rem 1.5rem;
            background: transparent;
            border: 2px solid var(--electric-blue);
            color: var(--electric-blue);
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Michroma', sans-serif;
            text-transform: lowercase;
        }

        .filter-btn.active {
            background: var(--neon-pink);
            border-color: var(--neon-pink);
            color: var(--black);
        }

        .filter-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 15px var(--neon-pink);
        }

        .writing-grid {
            display: grid;
            gap: 2rem;
            margin-top: 2rem;
        }

        .writing-item {
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid var(--electric-blue);
            padding: 1.5rem;
            transition: all 0.3s;
        }

        .writing-item[data-category="essay"] {
            border-color: var(--electric-blue);
        }

        .writing-item[data-category="poem"] {
            border-color: var(--neon-pink);
        }

        .writing-header {
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .writing-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
            padding-top: 1rem;
        }

        .expand-icon {
            color: var(--vapor-yellow);
            font-size: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="scanline"></div>

    <aside class="sidebar neon-pulse">
        <img src="profile-image.jpg" alt="Profile" class="profile-img">
        <nav>
            <a href="index.html">about</a>
            <a href="resume.html">resume</a>
            <a href="music.html">music</a>
            <a href="#writing">writing</a>
        </nav>
    </aside>

    <main>
        <section id="writing">
            <div class="writing-filters">
                <button class="filter-btn active" data-filter="all">all</button>
                <button class="filter-btn" data-filter="essay">essays</button>
                <button class="filter-btn" data-filter="poem">poems</button>
            </div>

            <div class="writing-grid">
                <!-- essays -->
                <div class="writing-item" data-category="essay">
                    <div class="writing-header" onclick="toggleWriting(this)">
                        <div>
                            <h2 class="neon-blue">sample essay</h2>
                            <p class="neon-pink">March 2025</p>
                        </div>
                        <span class="expand-icon">+</span>
                    </div>
                    <div class="writing-content">
                        <p class="neon-yellow">essay sample text</p>
                    </div>
                </div>

                <!-- poems -->
                <div class="writing-item" data-category="poem">
                    <div class="writing-header" onclick="toggleWriting(this)">
                        <div>
                            <h2 class="neon-pink">sample poem</h2>
                            <p class="neon-blue">March 2025</p>
                        </div>
                        <span class="expand-icon">+</span>
                    </div>
                    <div class="writing-content">
                        <p class="neon-yellow">poem sample text</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script>
        document.querySelectorAll('.filter-btn').forEach(button => {
            button.addEventListener('click', () => {
                const filter = button.dataset.filter;
                document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
                button.classList.add('active');

                document.querySelectorAll('.writing-item').forEach(item => {
                    item.style.display = (filter === 'all' || item.dataset.category === filter) ?
                        'block' : 'none';
                });
            });
        });

        function toggleWriting(header) {
            const content = header.parentElement.querySelector('.writing-content');
            const icon = header.querySelector('.expand-icon');

            if (content.style.maxHeight) {
                content.style.maxHeight = null;
                icon.textContent = '+';
            } else {
                content.style.maxHeight = content.scrollHeight + "px";
                icon.textContent = '-';
            }
        }
    </script>
</body>
</html>
